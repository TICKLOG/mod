# Builds one jar per Minecraft version and attaches them to the GitHub release
# v<mod_version>. Runs when main is pushed; skips if that release already exists.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Check release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        if: steps.exists.outputs.skip != 'true'
        run: ./build-all.sh

      - name: Release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" --target "$GITHUB_SHA" --title "$v" \
            --notes "Minecraft 26.1 to 26.3. Pick the jar for your version. Needs Fabric API." \
            $(ls build/libs/*.jar | grep -v sources)

      # Uploads each jar of the release to Modrinth as its own version, unless
      # Modrinth already has it. Needs the repository secret MODRINTH_TOKEN.
      - name: Modrinth
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then echo "No MODRINTH_TOKEN, skipped."; exit 0; fi
          v="${{ steps.v.outputs.version }}"
          api=https://api.modrinth.com/v2
          auth=(-H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: TICKLOG/mod release")
          project=$(curl -sf "${auth[@]}" "$api/project/ticklog" | jq -r .id)
          existing=$(curl -sf "${auth[@]}" "$api/project/$project/version" | jq -r '.[].version_number')
          mkdir -p modrinth
          gh release download "v$v" -p '*.jar' -D modrinth --clobber
          for jar in modrinth/*.jar; do
            mc=$(basename "$jar" .jar); mc=${mc#*+}
            number="$v+$mc"
            if grep -qx "$number" <<<"$existing"; then echo "$number already on Modrinth"; continue; fi
            games=$(grep '^game_versions=' "versions/$mc.properties" | cut -d= -f2 | jq -R 'split(" ")')
            data=$(jq -n --arg name "$v for $mc" --arg number "$number" --arg project "$project" --argjson games "$games" '{
              name: $name, version_number: $number, project_id: $project, game_versions: $games,
              loaders: ["fabric"], version_type: "release", featured: true, status: "listed",
              changelog: "See the GitHub release for changes.",
              dependencies: [{project_id: "P7dR8mSH", dependency_type: "required"}],
              file_parts: ["file"], primary_file: "file"}')
            curl -sf "${auth[@]}" -F "data=$data" -F "file=@$jar" "$api/version" > /dev/null
            echo "$number uploaded"
          done
